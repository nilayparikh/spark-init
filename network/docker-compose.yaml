# ── Network / Tunnel Services ────────────────────────────────────────────────
# Defines optional services for external access.
#
# cloudflared – Cloudflare Tunnel for exposing the stack externally.
#   Requires CLOUDFLARE_TUNNEL_TOKEN in .env.
#   Enables secure access to Grafana, LiteLLM, etc. without opening firewall ports.
#   Activate with profile: cloudflared (or "all").
# ──────────────────────────────────────────────────────────────────────────────

services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    container_name: ${CLOUDFLARED_CONTAINER_NAME:-cloudflared}
    restart: unless-stopped
    profiles:
      - cloudflared
      - all
    labels:
      "init.profile_name": "cloudflared"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
