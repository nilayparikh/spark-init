name: Bug Report
description: File a bug report for .init
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Your operating system and architecture
      options:
        - Ubuntu 24.04 (ARM64)
        - Ubuntu 22.04 (ARM64)
        - Ubuntu 24.04 (AMD64)
        - Ubuntu 22.04 (AMD64)
        - Debian Bookworm
        - Other Linux
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU Model
      description: NVIDIA GPU model and VRAM (e.g., L40S 48GB, RTX 4090 24GB)
      placeholder: "L40S 48GB"
    validations:
      required: true

  - type: input
    id: docker-version
    attributes:
      label: Docker Version
      description: Output of `docker --version`
      placeholder: "Docker version 27.5.1, build unknown"
    validations:
      required: true

  - type: input
    id: compose-profiles
    attributes:
      label: Compose Profiles Used
      description: Which Docker Compose profiles were active (e.g., data, observability)
      placeholder: "data, observability"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps leading to the bug
      placeholder: |
        1. docker compose -f docker-compose.yml -f docker-compose.data.yml up -d
        2. Wait for containers to start
        3. Check logs with `docker compose logs -f`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened, including relevant log output
