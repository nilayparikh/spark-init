# =============================================================================
# trivy-secret.yaml — Custom secret scanning rules for the .init project
#
# Adds rules for API key patterns used by this project that are NOT covered
# by Trivy's built-in rules (which handle GitHub tokens, AWS keys, HF tokens,
# private keys, DB URLs, etc.).
#
# Built-in allow-rules for markdown/tests/docs are disabled since this is
# a code repo where secrets would be significant in any file.
# =============================================================================
rules:
  # ── OpenAI / LiteLLM API Keys ──────────────────────────────────────────
  # Catches sk-... and pk-... prefixes common to OpenAI, LiteLLM, DeepSeek,
  # and many other AI platform API keys.
  - id: openai-api-key
    category: openai
    title: OpenAI or Similar API Key (sk-/pk- prefix)
    severity: CRITICAL
    regex: (?i)(?P<secret>(sk|pk)-[a-z0-9]{20,})
    secret-group-name: secret
    keywords:
      - "sk-"
      - "pk-"
    allow-rules:
      # Known safe patterns used throughout the codebase
      - regex: (?i)sk-dummy
      - regex: (?i)your[-_]?key[-_]?here
      - regex: (?i)your[-_]?token[-_]?here
      - regex: (?i)your[-_]?secret[-_]?here
      - regex: (?i)change[-_]?me
      - regex: (?i)placeholder
      - regex: (?i)your_api_key
      - regex: (?i)your_bearer_token

  # ── Database Connection Strings ────────────────────────────────────────
  # While Trivy catches some DB URLs, this is a broader catchall. Only
  # flags credentials (user:pass@host), not host-only references.
  - id: db-connection-string
    category: database
    title: Database Connection String with Credentials
    severity: HIGH
    regex: (postgresql|mysql|mongodb|redis|rediss)://[^:]+:[^@]+@
    secret-group-name: secret
    keywords:
      - "postgresql://"
      - "mysql://"
      - "mongodb://"
      - "redis://"
    allow-rules:
      - regex: (?i)user:pass@
      - regex: (?i)your.*password

# ── Disable noisy built-in allow-rules ──────────────────────────────────
# We want secrets caught everywhere, not just in "code" files.
disable-allow-rules:
  - markdown
  - tests
  - examples
  - vendor
