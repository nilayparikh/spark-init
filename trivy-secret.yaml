# trivy-secret.yaml — Custom secret scanning rules for the .init project
#
# Loaded by trivy.yaml → secret.config
# Covers patterns Trivy's built-in rules don't catch for this project.
#
# Built-in rules already cover: GitHub tokens, AWS keys, HF tokens,
# private keys, generic DB URLs, etc.

rules:
  # ── OpenAI / LiteLLM API Keys ──────────────────────────────────────────
  # Catches sk-... and pk-... prefixes common to OpenAI, LiteLLM, DeepSeek,
  # and many other AI platform API keys.
  - id: openai-api-key
    category: openai
    title: OpenAI or Similar API Key (sk-/pk- prefix)
    severity: CRITICAL
    regex: (?P<secret>(sk|pk)-[a-z0-9]{20,})
    secret-group-name: secret
    keywords:
      - "sk-"
      - "pk-"
    allow-rules:
      - regex: (?i)sk-dummy
      - regex: (?i)your[-_]?key[-_]?here
      - regex: (?i)your[-_]?token[-_]?here
      - regex: (?i)your[-_]?secret[-_]?here
      - regex: (?i)change[-_]?me
      - regex: (?i)placeholder
      - regex: (?i)your_api_key
      - regex: (?i)your_bearer_token

  # ── Database Connection Strings ────────────────────────────────────────
  # Flags credentials (user:pass@host), not host-only references.
  - id: db-connection-string
    category: database
    title: Database Connection String with Credentials
    severity: HIGH
    regex: (postgresql|mysql|mongodb|redis|rediss)://[^:]+:[^@]+@
    secret-group-name: secret
    keywords:
      - "postgresql://"
      - "mysql://"
      - "mongodb://"
      - "redis://"
    allow-rules:
      - regex: (?i)user:pass@
      - regex: (?i)your.*password

# Disable noisy built-in allow-rules — this is a code repo where
# secrets in any file type are significant.
disable-allow-rules:
  - markdown
  - tests
  - examples
  - vendor
