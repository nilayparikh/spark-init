# trivy.yaml — Trivy configuration for the .init project
#
# Loaded automatically by `trivy fs` (via -c, --config default).
# Custom secret rules live in trivy-secret.yaml (referenced below).
#
# Two touchpoints:
#   - .claude/hooks/trivy-scan.sh   → per-file scan on every Edit/Write
#   - .github/workflows/trivy.yml   → full repo scan in CI

# ── What to scan ──────────────────────────────────────────────────────────
scanners:
  - secret
  - misconfig

severity:
  - CRITICAL
  - HIGH
  - MEDIUM

# ── Misconfiguration scanning ────────────────────────────────────────────
# dockerfile  → our two Dockerfiles (llama-cpp-dgx, claude-code)
# kubernetes  → docker-compose YAMLs (Trivy treats them as k8s-style configs)
# terraform   → future-proof if we add IaC later
misconfiguration:
  scanners:
    - dockerfile
    - kubernetes
    - terraform
  # Don't download check updates on every scan (CI caches, local is fast)
  skip-check-update: true

# ── Secret scanning ──────────────────────────────────────────────────────
secret:
  config: trivy-secret.yaml

# ── Paths to skip ────────────────────────────────────────────────────────
scan:
  skip-dirs:
    - .cache
    - .git
    - .claude/sessions
    - .claude/plugins
    - .claude/projects
    - .claude/tasks
    - .claude/file-history
    - .claude/backups
    - .claude/paste-cache
    - .claude/history.jsonl
    - interfaces/llama-cpp/build
    - build
    - dist
    - node_modules
    - .venv
    - venv
    - .pytest_cache
    - .mypy_cache
    - .ruff_cache
    - .trivy
    - .cache/trivy
  skip-files:
    - .env
    - .env.local
    - .env.*
    - "*.gguf"
    - "*.safetensors"
    - "*.bin"
    - "*.pt"
    - "*.ckpt"

# ── Cache ────────────────────────────────────────────────────────────────
# Use .trivy/ instead of .cache/trivy/ (which is owned by root on DGX)
cache:
  dir: .trivy

# ── Output ───────────────────────────────────────────────────────────────
quiet: true
