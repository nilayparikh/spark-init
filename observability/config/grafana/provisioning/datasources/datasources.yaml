---
apiVersion: 1

datasources:
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009
    isDefault: true
    editable: false
    jsonData:
      prometheusType: Mimir
      cacheLevel: High

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: ${OBSERVABILITY_GRAFANA_MAX_LINES:-1000}
