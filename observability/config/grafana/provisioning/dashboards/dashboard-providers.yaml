---
apiVersion: 1

providers:
  - name: Observability Dashboards
    orgId: 1
    folder: Observability
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: ${OBSERVABILITY_DASHBOARD_UPDATE_INTERVAL:-30}
    options:
      path: /etc/grafana/provisioning/dashboards/machine
