---
auth_enabled: false

server:
  http_listen_port: ${OBSERVABILITY_LOKI_HTTP_PORT:-3100}
  grpc_listen_port: ${OBSERVABILITY_LOKI_GRPC_PORT:-9096}
  log_level: ${OBSERVABILITY_LOKI_LOG_LEVEL:-warn}

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false

limits_config:
  allow_structured_metadata: true
  retention_period: ${LOKI_RETENTION_PERIOD:-2d}
  volume_enabled: true

compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: ${OBSERVABILITY_LOKI_COMPACTION_INTERVAL:-10m}
  retention_enabled: true
  delete_request_store: filesystem
