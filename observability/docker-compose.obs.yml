services:
  mimir:
    image: grafana/mimir:latest
    container_name: mimir
    restart: "no"
    profiles:
      - obs
      - all
      - active
    labels:
      "init.profile_name": "obs"
    environment:
      MIMIR_RETENTION_PERIOD: ${MIMIR_RETENTION_PERIOD:-7d}
    command:
      - -config.file=/etc/mimir/mimir-config.yaml
      - -config.expand-env=true
    ports:
      - "0.0.0.0:9009:9009"
    volumes:
      - ./config/mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - ./config/alertmanager-fallback.yaml:/etc/mimir/alertmanager-fallback.yaml:ro
      - ../data/storage/mimir:/var/lib/mimir

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: "no"
    user: "0:0"
    profiles:
      - obs
      - all
      - active
    labels:
      "init.profile_name": "obs"
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-2d}
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -config.expand-env=true
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ../data/storage/loki:/var/lib/loki

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: "no"
    user: "0:0"
    profiles:
      - obs
      - all
      - active
    labels:
      "init.profile_name": "obs"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
      gpu-telemetry:
        condition: service_started
      cadvisor:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "0.0.0.0:12345:12345"
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - ./volumes/alloy:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/udev/data:/run/udev/data:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  gpu-telemetry:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.3-4.8.2-distroless
    container_name: gpu-telemetry
    restart: "no"
    profiles:
      - obs
      - all
      - active
    labels:
      "init.profile_name": "obs"
    gpus: all
    cap_add:
      - SYS_ADMIN

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: "no"
    profiles:
      - obs
      - all
      - active
    labels:
      "init.profile_name": "obs"
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,process,sched,tcp,udp,hugetlb,referenced_memory,resctrl
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: "no"
    user: "0:0"
    profiles:
      - obs
      - all
      - active
    labels:
      "init.profile_name": "obs"
    depends_on:
      postgres:
        condition: service_healthy
      mimir:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATABASE_HOST: postgres:${DATA_POSTGRES_PORT}
      GF_DATABASE_NAME: ${GRAFANA_DB_NAME}
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_USER: ${GRAFANA_DB_USER}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/machine/spark-machine-observability.json
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./volumes/grafana:/var/lib/grafana
