---
# ── Observability Layer ──────────────────────────────────────────────────────
# Auto-collected telemetry for the full stack.
# Flow: Alloy scrapes everything → Mimir (metrics) + Loki (logs) → Grafana
#
# Services:
#   mimir        – Prometheus-compatible time-series backend (metrics)
#   loki         – Log aggregation backend
#   alloy        – Collector: scrapes GPU/container/host + Docker logs
#   gpu-telemetry – DCGM exporter for NVIDIA GPU metrics
#   cadvisor     – Container resource metrics
#   grafana      – Dashboard UI (auto-provisioned dashboards + data sources)
#
# All services join the init_default network for cross-compose discovery.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── Mimir (Metrics) ───────────────────────────────────────────────────────
  # Prometheus-compatible time-series store. Single-binary mode.
  # Filesystem-backed (no S3/GCS dependency).
  # Retention: 7d (configurable via MIMIR_RETENTION_PERIOD).
  # Scraped by Alloy, queried by Grafana.
  # ──────────────────────────────────────────────────────────────────────────
  mimir:
    image: ${MIMIR_IMAGE:-grafana/mimir:latest}
    container_name: ${MIMIR_CONTAINER_NAME:-mimir}
    restart: "no"
    profiles:
      - mimir
      - obs
      - all
    labels:
      "init.profile_name": "obs"
    environment:
      MIMIR_RETENTION_PERIOD: ${MIMIR_RETENTION_PERIOD:-7d}
      OBSERVABILITY_MIMIR_HTTP_PORT: ${OBSERVABILITY_MIMIR_HTTP_PORT:-9009}
      OBSERVABILITY_MIMIR_LOG_LEVEL: ${OBSERVABILITY_MIMIR_LOG_LEVEL:-warn}
    command:
      - -config.file=/etc/mimir/mimir-config.yaml
      - -config.expand-env=true
    ports:
      - "0.0.0.0:${MIMIR_HOST_PORT:-9009}:9009"
    volumes:
      - ./config/mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - ./config/alertmanager-fallback.yaml:/etc/mimir/alertmanager-fallback.yaml:ro
      - ../data/storage/mimir:/var/lib/mimir

  # ── Loki (Logs) ──────────────────────────────────────────────────────────
  # Log aggregation store. Single-binary, filesystem-backed.
  # Retention: 2d (configurable via LOKI_RETENTION_PERIOD).
  # Receives Docker container logs + systemd journal from Alloy.
  # Queried by Grafana Explore and log dashboards.
  # ──────────────────────────────────────────────────────────────────────────
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:latest}
    container_name: ${LOKI_CONTAINER_NAME:-loki}
    restart: "no"
    user: "0:0"
    profiles:
      - loki
      - obs
      - all
    labels:
      "init.profile_name": "obs"
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-2d}
      OBSERVABILITY_LOKI_HTTP_PORT: ${OBSERVABILITY_LOKI_HTTP_PORT:-3100}
      OBSERVABILITY_LOKI_GRPC_PORT: ${OBSERVABILITY_LOKI_GRPC_PORT:-9096}
      OBSERVABILITY_LOKI_LOG_LEVEL: ${OBSERVABILITY_LOKI_LOG_LEVEL:-warn}
      OBSERVABILITY_LOKI_COMPACTION_INTERVAL: ${OBSERVABILITY_LOKI_COMPACTION_INTERVAL:-10m}
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -config.expand-env=true
    ports:
      - "0.0.0.0:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ../data/storage/loki:/var/lib/loki

  # ── Alloy (Collector) ────────────────────────────────────────────────────
  # Central telemetry collector (replaces Prometheus + Promtail).
  # Scrapes: GPU (DCGM :9400), containers (cAdvisor :8080),
  #          host (Unix exporter), LiteLLM & llama.cpp metrics endpoints
  # Ships:  metrics → Mimir, logs → Loki
  # Auto-discovers services via Docker socket (no config per new service).
  # ──────────────────────────────────────────────────────────────────────────
  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:latest}
    container_name: ${ALLOY_CONTAINER_NAME:-alloy}
    restart: "no"
    user: "0:0"
    profiles:
      - alloy
      - obs
      - all
    labels:
      "init.profile_name": "obs"
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
      gpu-telemetry:
        condition: service_started
      cadvisor:
        condition: service_started
    environment:
      OBSERVABILITY_HOST: ${OBSERVABILITY_HOST:-barsana}
      OBSERVABILITY_SITE: ${OBSERVABILITY_SITE:-barsana}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-personal}
      OBSERVABILITY_ROLE: ${OBSERVABILITY_ROLE:-spark-dgx}
      OBSERVABILITY_CLUSTER_TENANT: ${OBSERVABILITY_CLUSTER_TENANT:-spark_dgx_core}
      OBSERVABILITY_STACK: ${OBSERVABILITY_STACK:-observability-core}
      OBSERVABILITY_SCRAPE_INTERVAL_HOST: ${OBSERVABILITY_SCRAPE_INTERVAL_HOST:-5s}
      OBSERVABILITY_SCRAPE_TIMEOUT_HOST: ${OBSERVABILITY_SCRAPE_TIMEOUT_HOST:-4s}
      OBSERVABILITY_SCRAPE_INTERVAL_GPU: ${OBSERVABILITY_SCRAPE_INTERVAL_GPU:-5s}
      OBSERVABILITY_SCRAPE_TIMEOUT_GPU: ${OBSERVABILITY_SCRAPE_TIMEOUT_GPU:-4s}
      OBSERVABILITY_SCRAPE_INTERVAL_DOCKER: ${OBSERVABILITY_SCRAPE_INTERVAL_DOCKER:-15s}
      OBSERVABILITY_SCRAPE_TIMEOUT_DOCKER: ${OBSERVABILITY_SCRAPE_TIMEOUT_DOCKER:-10s}
      OBSERVABILITY_SCRAPE_INTERVAL_LLAMACPP: ${OBSERVABILITY_SCRAPE_INTERVAL_LLAMACPP:-15s}
      OBSERVABILITY_SCRAPE_TIMEOUT_LLAMACPP: ${OBSERVABILITY_SCRAPE_TIMEOUT_LLAMACPP:-10s}
      OBSERVABILITY_SCRAPE_INTERVAL_LITELLM: ${OBSERVABILITY_SCRAPE_INTERVAL_LITELLM:-30s}
      OBSERVABILITY_SCRAPE_TIMEOUT_LITELLM: ${OBSERVABILITY_SCRAPE_TIMEOUT_LITELLM:-25s}
      OBSERVABILITY_SCRAPE_INTERVAL_VLLM: ${OBSERVABILITY_SCRAPE_INTERVAL_VLLM:-15s}
      OBSERVABILITY_SCRAPE_TIMEOUT_VLLM: ${OBSERVABILITY_SCRAPE_TIMEOUT_VLLM:-10s}
      OBSERVABILITY_JOURNAL_MAX_AGE: ${OBSERVABILITY_JOURNAL_MAX_AGE:-12h}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "0.0.0.0:${ALLOY_HOST_PORT:-12345}:12345"
    volumes:
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - ./volumes/alloy:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/udev/data:/run/udev/data:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  # ── GPU Telemetry ──────────────────────────────────────────────────────────
  # DCGM (NVIDIA Data Center GPU Manager) exporter.
  # Distroless container — no shell, just metrics at :9400/metrics.
  # Scraped by Alloy every 5s, shipped to Mimir with job="machine-gpu".
  # Exposes: utilization, memory, thermals, power, clocks, ECC errors.
  # ──────────────────────────────────────────────────────────────────────────
  gpu-telemetry:
    image: ${DCGM_EXPORTER_IMAGE:-nvcr.io/nvidia/k8s/dcgm-exporter:4.5.3-4.8.2-distroless}
    container_name: ${GPU_TELEMETRY_CONTAINER_NAME:-gpu-telemetry}
    restart: "no"
    profiles:
      - gpu-telemetry
      - obs
      - all
    labels:
      "init.profile_name": "obs"
    gpus: all
    cap_add:
      - SYS_ADMIN

  # ── cAdvisor (Container Metrics) ──────────────────────────────────────────
  # Collects CPU, memory, network, and filesystem metrics per container.
  # Scraped by Alloy every 15s, shipped to Mimir with job="machine-docker".
  # Limited to Docker-in-Docker (--docker_only=true) — skips non-Docker cgroups.
  # ──────────────────────────────────────────────────────────────────────────
  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    container_name: ${CADVISOR_CONTAINER_NAME:-cadvisor}
    restart: "no"
    profiles:
      - cadvisor
      - obs
      - all
    labels:
      "init.profile_name": "obs"
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=percpu,process,sched,tcp,udp,hugetlb,referenced_memory,resctrl
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  # ── Grafana (Dashboards) ──────────────────────────────────────────────────
  # Visualization UI. Auto-provisions:
  #   - Data sources: Mimir (metrics) + Loki (logs)
  #   - Dashboards: machine overview, GPU signals, container logs, etc.
  #   - Alert rules from provisioning/alerting/
  # Login: admin / $GRAFANA_ADMIN_PASSWORD (from .env)
  # Requires Postgres healthy, Mimir + Loki started before launching.
  # ──────────────────────────────────────────────────────────────────────────
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:latest}
    container_name: ${GRAFANA_CONTAINER_NAME:-grafana}
    restart: "no"
    user: "0:0"
    profiles:
      - grafana
      - obs
      - all
    labels:
      "init.profile_name": "obs"
    depends_on:
      postgres:
        condition: service_healthy
      mimir:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATABASE_HOST: postgres:${DATA_POSTGRES_PORT}
      GF_DATABASE_NAME: ${GRAFANA_DB_NAME}
      GF_DATABASE_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_DATABASE_SSL_MODE: disable
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_USER: ${GRAFANA_DB_USER}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/machine/spark-machine-observability.json
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "0.0.0.0:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./volumes/grafana:/var/lib/grafana
