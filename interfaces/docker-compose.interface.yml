---
# ─── Interfaces Layer ─────────────────────────────────────────────────────────
# This compose file defines two types of services:
#   1. LiteLLM proxy – the API gateway that handles auth, routing, and logging
#   2. llama.cpp backends – GPU inference containers for each model
#
# LiteLLM reaches llama.cpp via host.docker.internal (host networking),
# because llama.cpp runs on host ports for direct GPU access.
#
# Provider credentials (API keys, base URLs) are set via .env and cascaded
# through multiple fallback names for backward compatibility.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ── LiteLLM Proxy ─────────────────────────────────────────────────────────
  # Unified API gateway. Exposes three surfaces on :4000:
  #   OpenAI /v1/chat/completions – standard chat API
  #   OpenAI /v1/responses        – OpenAI responses API
  #   Anthropic /v1/messages      – Claude Code compatibility
  #
  # Routes by model name to local (llama.cpp) or cloud backends.
  # Auth via Bearer token (LITELLM_MASTER_KEY).
  # Usage logs to PostgreSQL for spend tracking.
  # ────────────────────────────────────────────────────────────────────────────
  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:latest}
    container_name: ${LITELLM_CONTAINER_NAME:-litellm}
    restart: "no"
    profiles:
      - litellm
      - interface
      - all
    labels:
      "init.profile_name": "interface"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --config
      - /app/litellm-config/config.yaml
      - --port
      - "${LITELLM_PORT:-4000}"
      - --host
      - "${LITELLM_BIND_HOST:-0.0.0.0}"
    ports:
      - "${LITELLM_BIND_HOST:-0.0.0.0}:${LITELLM_PORT:-4000}:${LITELLM_PORT:-4000}"
    extra_hosts:
      # Allows LiteLLM to reach llama.cpp on host ports
      - host.docker.internal:host-gateway
    environment:
      LITELLM_LOG_LEVEL: ${LITELLM_LOG_LEVEL:-INFO}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-interface-ui-local}

      # LiteLLM config flags
      NO_DOCS: ${LITELLM_NO_DOCS:-True}
      NO_REDOC: ${LITELLM_NO_REDOC:-True}

      # Postgres connection for spend logging + provider config storage
      DATABASE_URL: ${INTERFACE_DATABASE_URL:-postgresql://litellm_interface:litellm_interface_local@postgres:5432/litellm_interface}

      # ── LiteLLM Router Settings ─────────────────────────────────────────
      # Routed into LiteLLM via os.environ/ in config.yaml router_settings block
      LITELLM_NUM_RETRIES: ${LITELLM_NUM_RETRIES:-5}
      LITELLM_RETRY_AFTER: ${LITELLM_RETRY_AFTER:-0}
      LITELLM_TIMEOUT_ERROR_RETRIES: ${LITELLM_TIMEOUT_ERROR_RETRIES:-5}
      LITELLM_RATE_LIMIT_ERROR_RETRIES: ${LITELLM_RATE_LIMIT_ERROR_RETRIES:-5}
      LITELLM_INTERNAL_ERROR_RETRIES: ${LITELLM_INTERNAL_ERROR_RETRIES:-5}
      LITELLM_MODEL_ALIAS_ULTRA: ${LITELLM_MODEL_ALIAS_ULTRA:-OpenCodeZen/BIG-PICKLE}
      LITELLM_MODEL_ALIAS_PRO: ${LITELLM_MODEL_ALIAS_PRO:-DGX/Qwen3.6-27B}
      LITELLM_MODEL_ALIAS_FLASH: ${LITELLM_MODEL_ALIAS_FLASH:-DGX/Qwen3.6-35B-A3B}
      LITELLM_JSON_LOGS: ${LITELLM_JSON_LOGS:-true}
      LITELLM_DROP_PARAMS: ${LITELLM_DROP_PARAMS:-true}
      LITELLM_REDACT_USER_API_KEY: ${LITELLM_REDACT_USER_API_KEY:-true}
      LITELLM_REQUIRE_AUTH_METRICS: ${LITELLM_REQUIRE_AUTH_METRICS:-false}
      LITELLM_TURN_OFF_MSG_LOGGING: ${LITELLM_TURN_OFF_MSG_LOGGING:-false}
      LITELLM_STREAM_USAGE: ${LITELLM_STREAM_USAGE:-true}

      # ── Inference Engine Tuning (shared with llama.cpp) ─────────────────
      # These drive llama.cpp CLI flags. LiteLLM model params (max_tokens,
      # temperature, seed, etc.) are hardcoded in providers/dgx-spark.yaml.
      # 27B (.INIT/Pro)
      INFERENCE_QWEN_27B_CONTEXT_SIZE: ${INFERENCE_QWEN_27B_CONTEXT_SIZE:-131072}
      INFERENCE_QWEN_27B_MAX_INPUT_TOKENS: ${INFERENCE_QWEN_27B_MAX_INPUT_TOKENS:-114688}
      INFERENCE_QWEN_27B_REASONING_BUDGET: ${INFERENCE_QWEN_27B_REASONING_BUDGET:-8192}
      # 35B A3B (.INIT/Flash)
      INFERENCE_QWEN_35B_A3B_CONTEXT_SIZE: ${INFERENCE_QWEN_35B_A3B_CONTEXT_SIZE:-262144}
      INFERENCE_QWEN_35B_A3B_MAX_INPUT_TOKENS: ${INFERENCE_QWEN_35B_A3B_MAX_INPUT_TOKENS:-245760}
      INFERENCE_QWEN_35B_A3B_REASONING_BUDGET: ${INFERENCE_QWEN_35B_A3B_REASONING_BUDGET:-8192}

      # ── Local backends ──────────────────────────────────────────────────
      # Each DGX_* group defines: base URL, API key, and model ID for one backend.
      # Map to the active profile: M=llama-qwen-3-6-27b (Pro/27B), S=llama-qwen-3-6-35b-a3b (Flash/35B A3B)
      DGX_SPARK_M_BASE_URL: ${DGX_SPARK_M_BASE_URL:-http://host.docker.internal:8000/v1}
      DGX_SPARK_M_API_KEY: ${DGX_SPARK_M_API_KEY:-sk-dummy}
      DGX_SPARK_M_SERVING_MODEL: ${DGX_SPARK_M_MODEL:-openai/qwen3.6_27b}
      DGX_SPARK_S_BASE_URL: ${DGX_SPARK_S_BASE_URL:-http://host.docker.internal:8001/v1}
      DGX_SPARK_S_API_KEY: ${DGX_SPARK_S_API_KEY:-sk-dummy}
      DGX_SPARK_S_SERVING_MODEL: ${DGX_SPARK_S_MODEL:-openai/qwen3.6_35b_a3b}

      # ── Cloud providers ─────────────────────────────────────────────────
      # Each group is read by the matching provider fragment in config/litellm/providers/.
      # Set API keys in .env; leave empty to disable that provider.
      MICROSOFT_FOUNDRY_API_BASE: ${MICROSOFT_FOUNDRY_API_BASE:-https://tuts.services.ai.azure.com/openai/v1}
      MICROSOFT_FOUNDRY_API_KEY: ${MICROSOFT_FOUNDRY_API_KEY:-}
      AZURE_ORCHESTRATOR_API_BASE: ${AZURE_ORCHESTRATOR_API_BASE:-https://tuts.services.ai.azure.com/openai/v1}
      AZURE_ORCHESTRATOR_API_KEY: ${AZURE_ORCHESTRATOR_API_KEY:-}
      AZURE_ORCHESTRATOR_MODEL: ${AZURE_ORCHESTRATOR_MODEL:-openai/Kimi-K2.6-1}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENCODE_ZEN_BASE_URL: ${OPENCODE_ZEN_BASE_URL:-https://api.opencode.zen.com/v1}
      OPENCODE_ZEN_API_KEY: ${OPENCODE_ZEN_API_KEY:-}
    volumes:
      - ./config/litellm:/app/litellm-config:ro

  # ── llama.cpp 27B (DGX Spark M / .INIT/Pro) ─────────────────────────────
  # Qwen 3.6 27B with MTP speculative decoding.
  # Context: 128K, threads: 8, batch: 2048.
  # Key flags:
  #   --jinja --chat-template-file    : custom Qwen chat template (reasoning format)
  #   --reasoning on --reasoning-format deepseek : chain-of-thought
  #   --spec-type draft-mtp           : multi-token prediction for speed
  #   -c 131072                       : 128K context window
  #   --cont-batching --cache-prompt  : continuous batching + prompt caching
  #   -ngl all -fa on                 : all layers to GPU, flash attention
  #   --mlock                         : lock model in RAM
  #   --metrics                       : Prometheus endpoint on /metrics
  # ──────────────────────────────────────────────────────────────────────────
  llama-qwen-3-6-27b:
    build:
      context: ../docker/llama-cpp-dgx
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_TAG: ${LLAMA_CPP_TAG:-b9222}
    image: ${LLAMA_QWEN_3_6_27B_IMAGE_REPO:-ghcr.io/nilayparikh/llama-cpp-dgx}:cuda13.1.2-${LLAMA_CPP_TAG:-b9222}
    container_name: ${LLAMA_QWEN_3_6_27B_CONTAINER_NAME:-llama-qwen-3-6-27b}
    restart: "on-failure"
    profiles:
      - llama-qwen-3-6-27b
      - interface
      - all
    labels:
      "init.profile_name": "llama-qwen-3-6-27b"
    platform: linux/arm64
    init: true
    cap_add:
      - IPC_LOCK
    runtime: nvidia
    ulimits:
      memlock: -1
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_LAUNCH_BLOCKING: 1
    ports:
      - "${LLAMA_QWEN_3_6_27B_BIND_HOST:-0.0.0.0}:${LLAMA_QWEN_3_6_27B_HOST_PORT:-8000}:${LLAMA_QWEN_3_6_27B_CONTAINER_PORT:-8080}"
    volumes:
      - ${LLAMA_QWEN_3_6_27B_GGUF_MODEL_PATH:-../models/qwen3.6-27b-text-nvfp4-mtp/qwen3.6-27b-text-nvfp4-mtp.gguf}:/models/model.gguf:ro
      - ./config/qwen3.6/chat_template.jinja:/workspace/chat_template.jinja:ro
    command:
      - "-m"
      - "/models/model.gguf"
      - "-a"
      - "qwen3.6_27b"
      - "--jinja"
      - "--chat-template-file"
      - "/workspace/chat_template.jinja"
      - "--reasoning"
      - "on"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-budget"
      - "${INFERENCE_QWEN_27B_REASONING_BUDGET:-8192}"
      - "--min-p"
      - "${INFERENCE_QWEN_27B_MIN_P:-0.05}"
      - "--spec-type"
      - "draft-mtp,ngram-mod"
      - "--spec-draft-n-max"
      - "${INFERENCE_QWEN_27B_SPEC_DRAFT_N_MAX:-3}"
      - "--spec-draft-p-min"
      - "${INFERENCE_QWEN_27B_SPEC_DRAFT_P_MIN:-0.88}"
      - "--spec-draft-ngl"
      - "${INFERENCE_QWEN_27B_SPEC_DRAFT_NGL:-99}"
      - "-ctk"
      - "f16"
      - "-ctv"
      - "f16"
      - "-ngl"
      - "all"
      - "-fa"
      - "on"
      - "-sm"
      - "none"
      - "-fit"
      - "off"
      - "-c"
      - "${INFERENCE_QWEN_27B_CONTEXT_SIZE:-131072}"
      - "-b"
      - "${INFERENCE_QWEN_27B_BATCH_SIZE:-2048}"
      - "-ub"
      - "${INFERENCE_QWEN_27B_UBATCH_SIZE:-512}"
      - "--parallel"
      - "1"
      - "--cont-batching"
      - "--cache-prompt"
      - "--swa-full"
      - "-t"
      - "${INFERENCE_QWEN_27B_THREADS:-8}"
      - "-tb"
      - "${INFERENCE_QWEN_27B_THREADS_BATCH:-8}"
      - "--mlock"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--metrics"
      - "--timeout"
      - "${INFERENCE_QWEN_27B_LLAMA_TIMEOUT:-120}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── llama.cpp 35B A3B (DGX Spark S / .INIT/Flash) ────────────────────────
  # Qwen 3.6 35B A3B (3.5B active params) with multimodal support.
  # Same flags as 27B, plus:
  #   -mm /models/mmproj.gguf         : multimodal projector for vision
  #   -c 262144                       : 256K context window (double the 27B)
  # ──────────────────────────────────────────────────────────────────────────
  llama-qwen-3-6-35b-a3b:
    build:
      context: ../docker/llama-cpp-dgx
      dockerfile: Dockerfile
      args:
        LLAMA_CPP_TAG: ${LLAMA_CPP_TAG:-b9222}
    image: ${LLAMA_QWEN_3_6_35B_A3B_IMAGE_REPO:-ghcr.io/nilayparikh/llama-cpp-dgx}:cuda13.1.2-${LLAMA_CPP_TAG:-b9222}
    container_name: ${LLAMA_QWEN_3_6_35B_A3B_CONTAINER_NAME:-llama-qwen-3-6-35b-a3b}
    restart: "on-failure"
    profiles:
      - llama-qwen-3-6-35b-a3b
      - interface
      - all
    labels:
      "init.profile_name": "llama-qwen-3-6-35b-a3b"
    platform: linux/arm64
    init: true
    cap_add:
      - IPC_LOCK
    runtime: nvidia
    ulimits:
      memlock: -1
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      CUDA_LAUNCH_BLOCKING: 1
    ports:
      - "${LLAMA_QWEN_3_6_35B_A3B_BIND_HOST:-0.0.0.0}:${LLAMA_QWEN_3_6_35B_A3B_HOST_PORT:-8001}:${LLAMA_QWEN_3_6_35B_A3B_CONTAINER_PORT:-8080}"
    volumes:
      - ${LLAMA_QWEN_3_6_35B_A3B_GGUF_MODEL_PATH:-../models/qwen3.6-35b-a3b-nvfp4-mtp/qwen3.6-35b-a3b-nvfp4-mtp.gguf}:/models/model.gguf:ro
      - ${LLAMA_QWEN_3_6_35B_A3B_MMPROJ_MODEL_PATH:-../models/qwen3.6-35b-a3b-nvfp4-mtp/mmproj-BF16.gguf}:/models/mmproj.gguf:ro
      - ./config/qwen3.6/chat_template.jinja:/workspace/chat_template.jinja:ro
    command:
      - "-m"
      - "/models/model.gguf"
      - "-mm"
      - "/models/mmproj.gguf"
      - "-a"
      - "qwen3.6_35b_a3b"
      - "--jinja"
      - "--chat-template-file"
      - "/workspace/chat_template.jinja"
      - "--reasoning"
      - "on"
      - "--reasoning-format"
      - "deepseek"
      - "--reasoning-budget"
      - "${INFERENCE_QWEN_35B_A3B_REASONING_BUDGET:-8192}"
      - "--min-p"
      - "0.05"
      - "--spec-type"
      - "draft-mtp,ngram-mod"
      - "--spec-draft-n-max"
      - "${INFERENCE_QWEN_35B_A3B_SPEC_DRAFT_N_MAX:-2}"
      - "--spec-draft-p-min"
      - "0.88"
      - "--spec-draft-ngl"
      - "99"
      - "-ctk"
      - "${INFERENCE_QWEN_35B_A3B_KV_CACHE_TYPE_KEY:-q8_0}"
      - "-ctv"
      - "${INFERENCE_QWEN_35B_A3B_KV_CACHE_TYPE_VALUE:-q8_0}"
      - "-ngl"
      - "all"
      - "-fa"
      - "on"
      - "-sm"
      - "none"
      - "-fit"
      - "off"
      - "-c"
      - "${INFERENCE_QWEN_35B_A3B_CONTEXT_SIZE:-262144}"
      - "-b"
      - "${INFERENCE_QWEN_35B_A3B_BATCH_SIZE:-2048}"
      - "-ub"
      - "${INFERENCE_QWEN_35B_A3B_UBATCH_SIZE:-512}"
      - "--parallel"
      - "1"
      - "--cont-batching"
      - "--cache-prompt"
      - "--swa-full"
      - "-t"
      - "${INFERENCE_QWEN_35B_A3B_THREADS:-8}"
      - "-tb"
      - "${INFERENCE_QWEN_35B_A3B_THREADS_BATCH:-8}"
      - "--mlock"
      - "--port"
      - "8080"
      - "--host"
      - "0.0.0.0"
      - "--metrics"
      - "--timeout"
      - "${INFERENCE_QWEN_35B_A3B_LLAMA_TIMEOUT:-120}"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
