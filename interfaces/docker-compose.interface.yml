      - "draft-mtp,ngram-mod"
      - "--spec-draft-n-max"
      - "2"
      - "--spec-draft-p-min"
      - "0.88"
      - "--spec-draft-ngl"
      - "99"
      - "-ctk"
      - "f16"
      - "-ctv"
      - "f16"
      - "-ngl"
      - "all"
      - "-fa"
      - "on"
      - "-sm"
      - "none"
      - "-fit"
      - "off"
      - "-c"
      - "262144"
      - "-b"
      - "2048"
      - "-ub"
      - "512"
      - "--parallel"
      - "1"
      - "--cont-batching"
      - "--cache-prompt"
      - "--swa-full"
      - "-t"
      - "8"
