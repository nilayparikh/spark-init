---
model_list:
  - model_name: OpenCodeZen/MIMO-V2.5-FREE
    litellm_params: &opencode_zen_params
      model: opencode/mimo-v2.5-free
      api_base: os.environ/OPENCODE_ZEN_BASE_URL
      api_key: os.environ/OPENCODE_ZEN_API_KEY
      timeout: 300
      max_tokens: 200000
      max_completion_tokens: 20000
      include_reasoning: true
      extra_body:
        temperature: 0.0
        top_p: 1.0
        reasoning_effort: high
        stream_options:
          include_usage: true
    model_info: &opencode_zen_model_info
      id: "opencode-mimo-v2.5-free"
      db_model: false
      supports_reasoning: true
      mode: chat
      context_window: 200000
      max_tokens: 200000
      max_input_tokens: 180000
      max_output_tokens: 20000
      supports_system_messages: true
      supports_native_streaming: true
      supports_vision: false
      supported_openai_params:
        - max_tokens
        - max_completion_tokens
        - stream
        - stream_options
        - temperature
        - top_p
        - stop

  - model_name: OpenCodeZen/NEMOTRON-3-SUPER-FREE
