---
model_list:
  # Base Profile: Centralised Configuration Block
  - model_name: DGX/PRO
    litellm_params:
      &dgx_qwen_params # Force LiteLLM to translate Claude Code's Anthropic payload into OpenAI structure
      model: openai/os.environ/PRO_SERVING_MODEL
      api_base: os.environ/PRO_BASE_URL
      api_key: os.environ/PRO_API_KEY
      timeout: 300

      # Advanced Reasoning & Token Configurations
      include_reasoning: true
      max_tokens: 131072
      max_completion_tokens: 16384

      extra_body:
        seed: 42
        temperature: 0.0
        top_p: 1.0
        top_k: 1
        presence_penalty: 0.0
        repetition_penalty: 1.0
        max_thinking_tokens: 8192
        forward_compatibility: true
        stream_options:
          include_usage: true
        chat_template_kwargs:
          enable_thinking: true
          preserve_thinking: false

    model_info: &dgx_qwen_model_info
      id: "dgx-pro"
      db_model: false
      supports_reasoning: true
      mode: chat
      context_window: 131072
      max_tokens: 131072
      max_input_tokens: 114688
      max_output_tokens: 16384
      supports_system_messages: true
      supports_native_streaming: true
      supports_vision: false
      supported_openai_params:
        - tools
        - tool_choice
        - parallel_tool_calls
        - response_format
        - max_tokens
        - max_completion_tokens
        - stream
        - stream_options
        - temperature
        - top_p
        - stop

  - model_name: DGX/FLASH
    litellm_params:
      <<: *dgx_qwen_params
      model: openai/os.environ/FLASH_SERVING_MODEL
      api_base: os.environ/FLASH_BASE_URL
      api_key: os.environ/FLASH_API_KEY
      timeout: 300

      max_tokens: 262144
      max_completion_tokens: 16384

    model_info:
      <<: *dgx_qwen_model_info
      id: "dgx-flash"
      context_window: 262144
      max_tokens: 262144
      max_input_tokens: 245760
      supports_vision: true

litellm_settings:
  drop_params: true
  modify_params: true
  set_completed_by_on_stream_chunks: true
  require_auth_for_metrics_endpoint: false
