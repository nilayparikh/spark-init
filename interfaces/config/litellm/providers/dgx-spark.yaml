---
# ── DGX Spark (Local) Provider ──────────────────────────────────────────────
# Routes to llama.cpp running on localhost (host.docker.internal).
# Two models: 27B (full params) and 35B A3B (sparse, vision-capable).
#
# The model, api_base, and api_key all come from environment variables
# injected by docker-compose.interface.yml (DGX_SPARK_M_* / DGX_SPARK_S_*).
# ──────────────────────────────────────────────────────────────────────────────

model_list:
  # ── .INIT/Pro alias maps here ────────────────────────────────────────────
  # Qwen 3.6 27B — primary coding/reasoning model
  # Backend: llama.cpp on localhost:8000
  - model_name: DGX/Qwen3.6-27B
    litellm_params: &dgx_qwen_params
      model: openai/os.environ/DGX_SPARK_M_SERVING_MODEL
      api_base: os.environ/DGX_SPARK_M_BASE_URL
      api_key: os.environ/DGX_SPARK_M_API_KEY
      timeout: 300

      # Advanced Reasoning & Token Configurations
      include_reasoning: true
      max_tokens: 131072
      max_completion_tokens: 16384

      extra_body:
        seed: 42
        temperature: 0.0
        top_p: 1.0
        top_k: 1
        presence_penalty: 0.0
        repetition_penalty: 1.0
        max_thinking_tokens: 8192
        forward_compatibility: true
        stream_options:
          include_usage: true
        chat_template_kwargs:
          enable_thinking: true
          preserve_thinking: false

    model_info: &dgx_qwen_model_info
      id: "dgx-qwen3.6-27b"
      db_model: false
      supports_reasoning: true
      mode: chat
      context_window: 131072
      max_tokens: 131072
      max_input_tokens: 114688
      max_output_tokens: 16384
      supports_system_messages: true
      supports_native_streaming: true
      supports_vision: false
      supported_openai_params:
        - tools
        - tool_choice
        - parallel_tool_calls
        - response_format
        - max_tokens
        - max_completion_tokens
        - stream
        - stream_options
        - temperature
        - top_p
        - stop

  # ── .INIT/Flash alias maps here ───────────────────────────────────────────
  # Qwen 3.6 35B A3B — fast, large-context, vision-capable
  # 256K context window, multimodal (mmproj for vision tasks)
  # Backend: llama.cpp on localhost:8001
  - model_name: DGX/Qwen3.6-35B-A3B
    litellm_params:
      <<: *dgx_qwen_params
      model: openai/os.environ/DGX_SPARK_S_SERVING_MODEL
      api_base: os.environ/DGX_SPARK_S_BASE_URL
      api_key: os.environ/DGX_SPARK_S_API_KEY
      timeout: 300

      max_tokens: 262144
      max_completion_tokens: 16384

    model_info:
      <<: *dgx_qwen_model_info
      id: "dgx-qwen3.6-35b-a3b"
      context_window: 262144
      max_tokens: 262144
      max_input_tokens: 245760
      max_output_tokens: 16384
      supports_vision: true
