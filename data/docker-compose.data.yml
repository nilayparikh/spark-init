---
# ── Data Layer ───────────────────────────────────────────────────────────────
# Shared PostgreSQL for the whole stack.
# Used by: LiteLLM (spend logs, provider config), Grafana (dashboards, users)
#
# Bootstrap scripts in config/postgres-init/ create databases + users on first
# start: 010-grafana.sh, 020-litellm-interface.sh
# Each consumer gets its own database and user within the same Postgres instance.
# ──────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: ${DATA_POSTGRES_IMAGE}
    container_name: ${DATA_POSTGRES_CONTAINER_NAME}
    restart: "no"
    profiles:
      - postgres
      - data
      - all
    labels:
      "init.profile_name": "data"
    environment:
      POSTGRES_DB: ${DATA_POSTGRES_DB}
      POSTGRES_USER: ${DATA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DATA_POSTGRES_PASSWORD}
      PGDATA: ${DATA_POSTGRES_PGDATA}
      GRAFANA_DB_NAME: ${GRAFANA_DB_NAME}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      INTERFACE_DB_NAME: ${INTERFACE_DB_NAME}
      INTERFACE_DB_USER: ${INTERFACE_DB_USER}
      INTERFACE_DB_PASSWORD: ${INTERFACE_DB_PASSWORD}
    ports:
      - "${DATA_POSTGRES_BIND_HOST}:${DATA_POSTGRES_PORT}:5432"
    volumes:
      - ./storage/postgres:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DATA_POSTGRES_USER} -d ${DATA_POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
