site_name: ".init Stack"
site_description: "One Docker Compose stack for AI-augmented software engineering on NVIDIA DGX Spark — local models, observability, multi-provider routing"
repo_url: https://github.com/nilayparikh/init-stack
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  palette:
    # Automatic toggle based on system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mermaid2

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Capabilities: capabilities.md
  - Architecture: architecture.md
  - Configuration: configuration.md
  - Guides: guides.md
  - Reference: reference.md
