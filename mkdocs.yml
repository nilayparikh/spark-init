site_name: ".init Stack"
site_description: "Modular Docker Compose platform for local AI inference and observability on NVIDIA hardware"
repo_url: https://github.com/nilayparikh/init-stack
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.highlight
  icon:
    repo: fontawesome/brands/github
  palette:
    # Automatic toggle based on system preference
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - mermaid2

nav:
  - Home: index.md

  - Getting Started:
      - Quick Start: getting-started/quickstart.md
      - Prerequisites: getting-started/prerequisites.md

  - Architecture:
      - Overview: architecture/overview.md
      - Inference Stack: architecture/inference-stack.md
      - Observability Stack: architecture/observability-stack.md
      - Networking: architecture/networking.md

  - Configuration:
      - Docker Compose: configuration/docker-compose.md
      - Environment Variables: configuration/environment-variables.md
      - Custom Configs: configuration/custom-configs.md

  - Guides:
      - Adding Models: guides/adding-models.md
      - Observability Setup: guides/observability-setup.md
      - GPU Configuration: guides/gpu-configuration.md
      - Troubleshooting: guides/troubleshooting.md

  - API Reference:
      - OpenAI Compatible: api/openai-compatible.md

  - Interfaces:
      - Developer Clients: interfaces/developer-clients.md

  - Observability:
      - Labeling Standard: observability/labeling.md
      - Log Coverage: observability/log-coverage.md
      - Dashboard Standards: observability/dashboard-standards.md
      - Interface Telemetry: observability/interface-telemetry.md
      - llama.cpp Telemetry: observability/llamacpp-telemetry.md

  - Reference:
      - File Index: reference/file-index.md
      - Docker Images: reference/docker-images.md

  - Contributing:
      - Development: contributing/development.md
      - Docs Guide: contributing/docs-guide.md
